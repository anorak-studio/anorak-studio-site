# Decap CMS config — a free, git-based admin panel.
# It edits the exact markdown files in src/content/projets/, so the site and the CMS
# never fall out of sync. Once this is live at yoursite.com/admin, editing a project
# here and clicking "Publish" commits the change to GitHub, and Cloudflare Pages
# automatically rebuilds the site.
#
# TODO before this works: replace `repo:` below with your real "owner/repo-name"
# once the GitHub repository exists, and wire up GitHub login (see docs/A-COMPLETER.md).

backend:
  name: github
  repo: anorak-studio/anorak-studio-site
  branch: main
  # Ce site héberge lui-même son "fournisseur" d'authentification GitHub
  # (voir functions/auth.js et functions/callback.js). Pas besoin de Netlify.
  base_url: https://anorak-studio-site.pages.dev

media_folder: "public/images/projets"
public_folder: "/images/projets"

collections:
  - name: "projets"
    label: "Projets"
    label_singular: "Projet"
    folder: "src/content/projets"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    # Chaque projet a son propre sous-dossier d'images (public/images/projets/<slug>/) : sans
    # ceci, la bibliothèque de médias ne regarde que la racine "public/images/projets" (qui ne
    # contient aucun fichier, seulement des sous-dossiers) et affiche "No assets found" même s'il
    # y a des centaines d'images sur le site.
    media_folder: "{{media_folder}}/{{slug}}"
    public_folder: "{{public_folder}}/{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Résumé (carte projet)", name: "summary", widget: "text", required: false }
      - { label: "Statut", name: "status", widget: "string", required: false, hint: "Ex. « Documentaire en production », « Court métrage, 2024 »" }
      - label: "Catégories"
        name: "categories"
        widget: "select"
        multiple: true
        default: []
        options: ["Réalisation", "Gamification", "Jeu vidéo", "Science", "Identité", "Web", "Imprimé", "Illustration", "Vidéo", "IA"]
      - { label: "Image de couverture", name: "cover", widget: "image", required: false, hint: "Photo principale : hero de la page projet. Idéalement une image en format paysage (pas verticale) pour une bonne bannière." }
      - { label: "Vignette (grille de projets)", name: "thumb", widget: "image", required: false, hint: "Optionnel. Si vide, la couverture est utilisée. Utile pour montrer une version horizontale de la couverture dans la grille." }
      - label: "Galerie"
        name: "gallery"
        widget: "list"
        default: []
        field: { label: "Image", name: "image", widget: "image" }
      - label: "Vidéos"
        name: "videos"
        widget: "list"
        default: []
        fields:
          - { label: "ID YouTube", name: "id", widget: "string", hint: "Juste l'identifiant, ex. dQw4w9WgXcQ" }
          - label: "Format"
            name: "ratio"
            widget: "select"
            default: "landscape"
            options:
              - { label: "Horizontal (16:9, bande-annonce classique)", value: "landscape" }
              - { label: "Vertical (9:16, ex. YouTube Shorts)", value: "portrait" }
              - { label: "Carré (1:1)", value: "square" }
      - label: "Liens"
        name: "links"
        widget: "list"
        default: []
        fields:
          - { label: "Texte du bouton", name: "label", widget: "string" }
          - { label: "URL", name: "href", widget: "string" }
      - { label: "Fait avec l'IA", name: "ai", widget: "boolean", default: false }
      - { label: "Note boutique", name: "shop", widget: "string", required: false }
      - label: "À compléter (rappels internes)"
        name: "todo"
        widget: "list"
        default: []
        field: { label: "Élément", name: "item", widget: "string" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", default: 100, hint: "1-99 = nouveaux projets, 100+ = anciens projets. Plus petit = plus haut dans la grille." }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "Brouillon (masqué du site)", name: "draft", widget: "boolean", default: false }
      - { label: "Texte du projet", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    files:
      - name: "accueil"
        label: "Accueil"
        file: "src/content/site/accueil.json"
        fields:
          - label: "Introduction (paragraphes)"
            name: "intro"
            widget: "list"
            hint: "Un item de liste = un paragraphe."
          - { label: "Description (référencement / partage)", name: "description", widget: "text" }
          - label: "Bande verte (« statement »)"
            name: "statement"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }
          - label: "À propos (page Contact)"
            name: "about"
            widget: "list"

      - name: "services"
        label: "Services"
        file: "src/content/site/services.json"
        fields:
          - label: "Introduction (« Vous êtes sur le point de lancer un projet? »)"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Question", name: "q", widget: "string" }
              - { label: "Texte (paragraphes)", name: "text", widget: "list" }
          - label: "Bande « Notre approche »"
            name: "approche"
            widget: "object"
            fields:
              - { label: "Amorce (eyebrow)", name: "eyebrow", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte (paragraphes)", name: "text", widget: "list" }
          - { label: "Note sur l'intelligence artificielle", name: "aiNote", widget: "text" }
          - label: "Les 8 services"
            name: "items"
            widget: "object"
            fields:
              - label: "01 — Image de marque"
                name: "identite"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Accroche", name: "lead", widget: "string" }
                  - { label: "Texte (paragraphes)", name: "text", widget: "list", default: [] }
              - label: "02 — Design stratégique"
                name: "design-strategique"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Accroche", name: "lead", widget: "string" }
                  - { label: "Texte (paragraphes)", name: "text", widget: "list", required: false, default: [] }
                  - label: "Sections (sous-titres)"
                    name: "sections"
                    widget: "list"
                    required: false
                    default: []
                    fields:
                      - { label: "Sous-titre", name: "heading", widget: "string", required: false }
                      - { label: "Paragraphes", name: "paragraphs", widget: "list" }
                  - label: "Étapes du design thinking"
                    name: "designThinking"
                    widget: "list"
                    required: false
                    default: []
                  - { label: "Note sous les étapes", name: "designThinkingNote", widget: "string", required: false }
              - label: "03 — Réalisation"
                name: "realisation"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Accroche", name: "lead", widget: "string" }
                  - { label: "Texte (paragraphes)", name: "text", widget: "list", default: [] }
              - label: "04 — Gamification et Indie Game"
                name: "gamification"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Accroche", name: "lead", widget: "string" }
                  - { label: "Texte (paragraphes)", name: "text", widget: "list", required: false, default: [] }
                  - label: "Sections (sous-titres)"
                    name: "sections"
                    widget: "list"
                    required: false
                    default: []
                    fields:
                      - { label: "Sous-titre", name: "heading", widget: "string", required: false }
                      - { label: "Paragraphes", name: "paragraphs", widget: "list" }
              - label: "05 — Prises de vues par drone"
                name: "drone"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Accroche", name: "lead", widget: "string" }
                  - { label: "Texte (paragraphes)", name: "text", widget: "list", default: [] }
              - label: "06 — Web et applications"
                name: "web"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Accroche", name: "lead", widget: "string" }
                  - { label: "Texte (paragraphes)", name: "text", widget: "list", default: [] }
              - label: "07 — Illustration et pixel art"
                name: "illustration"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Accroche", name: "lead", widget: "string" }
                  - { label: "Texte (paragraphes)", name: "text", widget: "list", default: [] }
              - label: "08 — Imprimé et édition"
                name: "imprime"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Accroche", name: "lead", widget: "string" }
                  - { label: "Texte (paragraphes)", name: "text", widget: "list", default: [] }

      - name: "realisation"
        label: "Réalisation (introduction)"
        file: "src/content/site/realisation.json"
        fields:
          - { label: "Introduction (paragraphes)", name: "intro", widget: "list" }

      - name: "gamification"
        label: "Gamification (introduction et réseaux)"
        file: "src/content/site/gamification.json"
        fields:
          - { label: "Introduction (paragraphes)", name: "intro", widget: "list" }
          - label: "Réseaux sociaux — Anorak Studio Games"
            name: "gamesSocial"
            widget: "list"
            hint: "Comptes pixel art / jeux indépendants, affichés au bas de la page Gamification."
            fields:
              - { label: "Nom", name: "label", widget: "string" }
              - label: "Icône"
                name: "icon"
                widget: "select"
                options: ["facebook", "instagram", "tiktok", "youtube", "threads", "x", "linkedin", "linktree"]
              - { label: "URL", name: "href", widget: "string" }

      - name: "contact"
        label: "Contact et réseaux sociaux"
        file: "src/content/site/contact.json"
        fields:
          - { label: "Courriel public", name: "email", widget: "string" }
          - { label: "Courriel direct", name: "emailDirect", widget: "string" }
          - { label: "Téléphone (affiché)", name: "phone", widget: "string" }
          - { label: "Téléphone (lien « tel: »)", name: "phoneHref", widget: "string" }
          - label: "Adresse"
            name: "address"
            widget: "object"
            fields:
              - { label: "Rue", name: "street", widget: "string" }
              - { label: "Ville", name: "city", widget: "string" }
              - { label: "Pays", name: "country", widget: "string" }
              - { label: "Code postal", name: "postal", widget: "string" }
          - label: "Réseaux sociaux (studio)"
            name: "social"
            widget: "list"
            hint: "Comptes principaux du studio, affichés dans le menu, le pied de page et la page Contact."
            fields:
              - { label: "Nom", name: "label", widget: "string" }
              - label: "Icône"
                name: "icon"
                widget: "select"
                options: ["facebook", "instagram", "tiktok", "youtube", "threads", "x", "linkedin", "linktree"]
              - { label: "URL", name: "href", widget: "string" }
