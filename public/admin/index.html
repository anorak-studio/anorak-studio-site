<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contenu — Anorak Studio</title>
  </head>
  <body>
    <!-- Diagnostic banner: shows any JS error, unhandled promise rejection, or failed GitHub API
         call on-screen instead of leaving it silent in the browser console. This is temporary,
         to figure out exactly what happens when Publish appears to do nothing — if it fires,
         screenshot the red banner (or copy its text) and send it over so the real cause can be
         fixed, then this can come back out. Must load BEFORE decap-cms.js so it can wrap fetch. -->
    <script>
      (function () {
        function showBanner(msg) {
          var el = document.getElementById('cms-error-banner');
          if (!el) {
            el = document.createElement('div');
            el.id = 'cms-error-banner';
            el.style.cssText =
              'position:fixed;top:0;left:0;right:0;z-index:999999;background:#b00020;' +
              'color:#fff;font:13px/1.5 monospace;padding:12px 16px;white-space:pre-wrap;' +
              'max-height:45vh;overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,.4);';
            var hint = document.createElement('div');
            hint.textContent = '⚠ Erreur détectée — copie ce message ou fais une capture d\'écran, puis envoie-le à Claude :';
            hint.style.cssText = 'font-weight:bold;margin-bottom:8px;';
            el.appendChild(hint);
            document.body.appendChild(el);
          }
          var line = document.createElement('div');
          line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
          line.style.marginBottom = '10px';
          el.appendChild(line);
        }
        window.addEventListener('error', function (e) {
          showBanner('Erreur JS : ' + (e.message || (e.error && e.error.message) || e.error) +
            (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var msg = reason && reason.message ? reason.message : String(reason);
          showBanner('Promesse non gérée : ' + msg);
        });
        var origFetch = window.fetch;
        window.fetch = function () {
          var url = arguments[0] && arguments[0].url ? arguments[0].url : arguments[0];
          return origFetch.apply(this, arguments).then(function (res) {
            if (!res.ok && String(url).indexOf('api.github.com') !== -1) {
              res.clone().text().then(function (body) {
                showBanner('Échec appel GitHub (' + res.status + ' ' + res.statusText + ') sur ' + url + ' : ' + body.slice(0, 500));
              }).catch(function () {});
            }
            return res;
          }).catch(function (err) {
            showBanner('Échec réseau sur ' + url + ' : ' + (err && err.message ? err.message : err));
            throw err;
          });
        };
      })();
    </script>

    <!-- Decap CMS: a free, git-based admin panel. It edits the same markdown files
         in src/content/projets/ that the site reads — no separate database.
         Pinned to an exact version (never a floating range like "^3.0.0"): with a
         floating range, unpkg can silently serve a different build on any page
         load, with no deploy on our side and no way to know which build is running.
         3.0.0 (the very first 3.x release) is what this was pinned to before, and
         is the likely real cause of "Publish now" silently doing nothing — 16+
         minor/patch releases have shipped since. Bumped to 3.16.3, the latest
         stable release as of this writing (3.17.0 is still a beta). -->
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>

    <!-- Reset button: clears everything the CMS keeps in this browser (local backups/drafts in
         IndexedDB, the saved GitHub login in localStorage, any cached requests) and reloads.
         A page can't drive the browser's own "Clear site data" dialog (no JS access to that),
         but this clears the actual data that dialog would clear for this site, which is what
         fixes a stuck local backup or a stale login — no need to dig through browser settings. -->
    <button
      id="cms-reset-btn"
      type="button"
      style="position:fixed;bottom:14px;left:14px;z-index:999998;background:#1f4d3a;color:#fff;
             border:none;border-radius:6px;padding:9px 14px;font:13px/1.2 sans-serif;
             cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.85;"
      onmouseover="this.style.opacity='1'"
      onmouseout="this.style.opacity='.85'"
    >Réinitialiser le CMS (efface les données locales)</button>
    <script>
      document.getElementById('cms-reset-btn').addEventListener('click', async function () {
        var ok = confirm(
          'Ceci efface les brouillons/sauvegardes locales et ta connexion GitHub enregistrée ' +
          'dans ce navigateur (tu devras te reconnecter). Aucun projet publié n\'est touché. Continuer ?'
        );
        if (!ok) return;
        try { localStorage.clear(); } catch (e) {}
        try { sessionStorage.clear(); } catch (e) {}
        try {
          if (window.indexedDB && indexedDB.databases) {
            var dbs = await indexedDB.databases();
            await Promise.all(
              dbs.map(function (db) {
                return new Promise(function (resolve) {
                  var req = indexedDB.deleteDatabase(db.name);
                  req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
                });
              })
            );
          } else {
            // Older browsers without indexedDB.databases(): delete the names Decap/localForage
            // actually use, as a fallback.
            ['localforage', 'keyvaluepairs', 'backend-storage', 'netlify-cms-backend', 'decap-cms-backend'].forEach(
              function (name) { indexedDB.deleteDatabase(name); }
            );
          }
        } catch (e) {}
        try {
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        alert('Données locales effacées. La page va se recharger.');
        location.reload();
      });
    </script>
  </body>
</html>
